version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: testhub_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-testhub}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testhub_network

  redis:
    image: redis:7-alpine
    container_name: testhub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testhub_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testhub_backend
    environment:
      PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-testhub}
      DB_SSL_MODE: disable
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET:-testhub-super-secret-jwt-key-production-ready-min-32-chars}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - testhub_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testhub_frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - testhub_network

volumes:
  postgres_data:
  redis_data:

networks:
  testhub_network:
    driver: bridge
